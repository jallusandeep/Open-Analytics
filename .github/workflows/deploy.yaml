name: Production Docker Image Build

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Build & push backend image
        run: |
          docker build \
            -f server/docker/backend.Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/openanalytics-backend2:latest \
            .
          docker push ghcr.io/${{ github.repository_owner }}/openanalytics-backend2:latest

      - name: Build & push frontend image
        run: |
          docker build \
            -f server/docker/frontend.Dockerfile \
            --build-arg VITE_API_BASE_URL=https://api.openanalytics.co.in/api/v1 \
            --build-arg VITE_UPSTOX_REDIRECT_URL=https://openanalytics.co.in/connections/upstox/callback \
            -t ghcr.io/${{ github.repository_owner }}/openanalytics-frontend2:latest \
            .
          docker push ghcr.io/${{ github.repository_owner }}/openanalytics-frontend2:latest
  deploy-to-rubik:
    if: ${{ vars.ENABLE_RUBIK_DEPLOY == 'true' }}
    name: Deploy to Rubik Docker Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ secrets.RUBIK_DEPLOY_DIR }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/openanalytics-backend2:latest
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/openanalytics-frontend2:latest
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          QUANT_REFRESH_LIMIT: 1000
        with:
          host: ${{ secrets.RUBIK_HOST }}
          username: ${{ secrets.RUBIK_USER }}
          password: ${{ secrets.RUBIK_PASSWORD }}
          envs: DEPLOY_DIR,BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USERNAME,GHCR_TOKEN,QUANT_REFRESH_LIMIT
          script: |
            set -e

            DEPLOY_DIR="${DEPLOY_DIR:-/opt/open-analytics/server/docker}"
            cd "$DEPLOY_DIR"

            if [ -f .env ]; then
              set -a
              . ./.env
              set +a
            fi

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USERNAME:-${USER}}" --password-stdin
            fi

            export BACKEND_IMAGE="$BACKEND_IMAGE"
            export FRONTEND_IMAGE="$FRONTEND_IMAGE"
            export QUANT_REFRESH_ON_STARTUP="${QUANT_REFRESH_ON_STARTUP:-true}"
            export QUANT_REFRESH_LIMIT="${QUANT_REFRESH_LIMIT:-1000}"
            export QUANT_REFRESH_INCLUDE_DEEP_LEARNING="${QUANT_REFRESH_INCLUDE_DEEP_LEARNING:-true}"
            export QUANT_REFRESH_TRAIN_MISSING_MODELS="${QUANT_REFRESH_TRAIN_MISSING_MODELS:-false}"
            export QUANT_REFRESH_REBUILD="${QUANT_REFRESH_REBUILD:-false}"

            docker compose -f docker-compose.yaml pull backend frontend
            docker compose -f docker-compose.yaml up -d backend frontend watchtower

            BACKEND_PORT="${BACKEND_PORT:-8000}"
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${BACKEND_PORT}/health" >/dev/null; then
                break
              fi
              sleep 5
            done

            curl -fsS -X POST "http://127.0.0.1:${BACKEND_PORT}/api/v1/quant-research/predictions/refresh?limit=${QUANT_REFRESH_LIMIT}&rebuild=false&include_deep_learning=true&train_missing_models=false" >/dev/null || true
            docker image prune -f
